openapi: 3.0.0
info:
  title: Calls Calendar
  version: 0.0.0
tags: []
paths:
  /api/available-slots:
    get:
      operationId: AvailableSlotsApi_list
      parameters:
        - name: eventTypeId
          in: query
          required: true
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableSlots'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
  /api/bookings:
    post:
      operationId: Bookings_create
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '404':
          description: The server cannot find the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreate'
  /api/event-types:
    get:
      operationId: EventTypes_list
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventType'
    post:
      operationId: EventTypes_create
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventType'
        '400':
          description: The server could not understand the request due to invalid syntax.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '409':
          description: The request conflicts with the current state of the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventTypeCreate'
  /api/meetings:
    get:
      operationId: Meetings_list
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Meeting'
  /health:
    get:
      operationId: Health_check
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
components:
  schemas:
    AvailableSlots:
      type: object
      required:
        - eventTypeId
        - durationMinutes
        - windowFrom
        - windowTo
        - slots
      properties:
        eventTypeId:
          type: string
        durationMinutes:
          type: integer
          format: int32
        windowFrom:
          type: string
          format: date
        windowTo:
          type: string
          format: date
        slots:
          type: array
          items:
            type: string
            format: date-time
    Booking:
      type: object
      required:
        - id
        - eventTypeId
        - eventTypeTitle
        - topic
        - start
        - end
      properties:
        id:
          type: string
        eventTypeId:
          type: string
        eventTypeTitle:
          type: string
        topic:
          type: string
          maxLength: 200
          description: Optional call topic provided by the guest; empty string when absent.
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
    BookingCreate:
      type: object
      required:
        - eventTypeId
        - start
      properties:
        eventTypeId:
          type: string
        start:
          type: string
          format: date-time
        topic:
          type: string
          maxLength: 200
          description: Optional call topic; empty or missing means no topic.
    ConflictError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    EventType:
      type: object
      required:
        - id
        - title
        - description
        - durationMinutes
      properties:
        id:
          type: string
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        durationMinutes:
          type: integer
          format: int32
          minimum: 1
          maximum: 480
    EventTypeCreate:
      type: object
      required:
        - id
        - title
        - description
        - durationMinutes
      properties:
        id:
          type: string
          pattern: ^[a-z0-9-]{1,64}$
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        durationMinutes:
          type: integer
          format: int32
          minimum: 1
          maximum: 480
    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
    Meeting:
      type: object
      required:
        - id
        - eventTypeId
        - eventTypeTitle
        - topic
        - start
        - end
      properties:
        id:
          type: string
        eventTypeId:
          type: string
        eventTypeTitle:
          type: string
        topic:
          type: string
          maxLength: 200
          description: Same as the booking's topic; empty string when absent.
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
    NotFoundError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    ValidationError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
